[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
# Upstream code in src/ is linted once it is rewritten (Phase 1+); the
# reference installer is kept verbatim.
extend-exclude = ["src", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
