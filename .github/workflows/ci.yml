name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: shellcheck
        run: shellcheck install.sh compat/proton tests/fakes/stubs/*

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # wemod_deck runs on the SteamOS system Python: support 3.9 and up.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            pip install "pytest<9"  # pytest 9 needs Python 3.10+
          else
            pip install -r requirements-dev.txt
          fi
      - run: pytest -v
